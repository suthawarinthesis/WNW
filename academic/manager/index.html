<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Academic Manager</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/app-config.js?v=20261008-departments"></script><style>body{font-family:'Noto Sans Thai',sans-serif;background:#f8fafc}.glass{background:rgba(255,255,255,.8);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.92);box-shadow:0 10px 35px rgba(15,23,42,.07)}.field{width:100%;border:1px solid #e2e8f0;background:#fff;border-radius:1rem;padding:.75rem 1rem;font-size:.875rem;outline:none}.field:focus{border-color:#fb923c;box-shadow:0 0 0 3px rgba(251,146,60,.14)}.label{display:block;font-size:.75rem;font-weight:700;color:#475569;margin-bottom:.4rem}.tab.active{background:#f97316;color:#fff}.hidden-force{display:none!important}</style></head>
<body class="min-h-screen text-slate-800">
<div id="login" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xl flex items-center justify-center p-4"><div class="w-full max-w-md glass bg-white/95 rounded-[2rem] p-8"><div class="text-center mb-6"><div class="w-16 h-16 mx-auto rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center mb-4"><i data-lucide="graduation-cap" class="w-8 h-8"></i></div><h1 class="text-2xl font-bold">Academic Manager</h1><p class="text-sm text-slate-500 mt-1">ฝ่ายวิชาการ โรงเรียนวัดหนองแวงวิทยา</p></div><form id="login-form" class="space-y-4"><div><label class="label">อีเมลผู้ดูแล</label><input id="email" type="email" class="field" required></div><div><label class="label">รหัสผ่าน</label><input id="password" type="password" class="field" required></div><button class="w-full rounded-2xl bg-orange-500 text-white py-3 font-bold">เข้าสู่ระบบ</button></form><p id="login-error" class="hidden text-xs text-red-600 mt-4"></p><a href="../" class="inline-flex mt-6 text-xs text-slate-500 hover:text-orange-600">← กลับหน้าฝ่ายวิชาการ</a></div></div>
<div id="app" class="hidden"><nav class="sticky top-0 z-30 glass"><div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between"><div><h1 class="font-bold text-lg">Academic Manager</h1><p class="text-xs text-orange-600">จัดการประกาศและเอกสารฝ่ายวิชาการ</p></div><div class="flex gap-2"><a href="../" class="px-4 py-2 rounded-full bg-white border text-sm font-bold">ดูหน้าเว็บ</a><button id="logout" class="px-4 py-2 rounded-full bg-slate-900 text-white text-sm font-bold">ออกจากระบบ</button></div></div></nav><main class="max-w-7xl mx-auto px-4 sm:px-6 py-8"><div class="flex gap-2 mb-6"><button class="tab active px-5 py-2.5 rounded-full bg-white font-bold text-sm" data-tab="posts">ประกาศ</button><button class="tab px-5 py-2.5 rounded-full bg-white font-bold text-sm" data-tab="files">เอกสาร</button></div>
<section id="panel-posts" class="space-y-5"><div class="glass rounded-[2rem] p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-xl font-bold">ประกาศฝ่ายวิชาการ</h2><p class="text-sm text-slate-500 mt-1">ประกาศที่เผยแพร่จะแสดงใน Subweb และหน้าเว็บหลัก</p></div><button id="add-post" class="px-4 py-2.5 rounded-xl bg-orange-500 text-white font-bold text-sm">+ เพิ่มประกาศ</button></div><div id="post-list" class="space-y-3"></div></section>
<section id="panel-files" class="hidden space-y-5"><div class="glass rounded-[2rem] p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-xl font-bold">เอกสารฝ่ายวิชาการ</h2><p class="text-sm text-slate-500 mt-1">รองรับเอกสารวิชาการ การเงิน และประกัน/ประเมินคุณภาพ</p></div><button id="add-file" class="px-4 py-2.5 rounded-xl bg-orange-500 text-white font-bold text-sm">+ เพิ่มเอกสาร</button></div><div id="file-list" class="space-y-3"></div></section></main></div>
<div id="modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4"><div class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm" data-close></div><div class="relative z-10 w-full max-w-2xl max-h-[90vh] overflow-y-auto glass bg-white/95 rounded-[2rem] p-6 sm:p-8"><div class="flex items-center justify-between mb-5"><div><h3 id="modal-title" class="text-xl font-bold"></h3><p id="modal-help" class="text-xs text-slate-500 mt-1"></p></div><button data-close class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button></div><form id="editor" class="space-y-4"></form></div></div>
<div id="toast" class="fixed bottom-5 right-5 z-[80] hidden px-5 py-3 rounded-2xl bg-slate-900 text-white text-sm font-bold shadow-2xl"></div><script src="./manager.js?v=20261008"></script></body></html>
