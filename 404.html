<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ไม่พบหน้าที่ต้องการ | โรงเรียนวัดหนองแวงวิทยา</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><style>body{font-family:'Noto Sans Thai',sans-serif}</style></head>
<body class="min-h-screen bg-gradient-to-br from-orange-50 via-white to-amber-50 flex items-center justify-center p-4"><main class="w-full max-w-2xl bg-white/90 border border-orange-100 rounded-[2.5rem] p-7 sm:p-10 text-center shadow-xl shadow-orange-100/50"><p class="text-7xl sm:text-8xl font-black text-orange-500">404</p><h1 class="text-2xl sm:text-3xl font-black mt-3">ไม่พบหน้าที่คุณกำลังค้นหา</h1><p class="text-slate-500 mt-3">ลิงก์อาจถูกย้าย เปลี่ยนชื่อ หรือพิมพ์ไม่ถูกต้อง</p><div class="mt-7 bg-slate-50 rounded-2xl p-3 flex gap-2"><input id="q" class="flex-1 bg-transparent px-2 outline-none text-sm" placeholder="ค้นหาหน้า เช่น สมัครเรียน ศิษย์เก่า บริจาค"><button id="search" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold text-sm">ค้นหา</button></div><div class="grid sm:grid-cols-2 gap-3 mt-5"><a data-route="" class="route px-4 py-3 rounded-xl bg-orange-500 text-white font-bold">กลับหน้าแรก</a><a data-route="admission/" class="route px-4 py-3 rounded-xl bg-slate-100 text-slate-700 font-bold">สมัครเรียน</a><a data-route="about-60/" class="route px-4 py-3 rounded-xl bg-slate-100 text-slate-700 font-bold">รู้จักโรงเรียน 60 วินาที</a><a data-route="emergency/" class="route px-4 py-3 rounded-xl bg-rose-50 text-rose-700 font-bold">ข้อมูลฉุกเฉิน</a></div></main>
<script>
function base(){const p=location.pathname.split('/').filter(Boolean);return location.hostname.endsWith('.github.io')&&p.length?`${location.origin}/${p[0]}/`:`${location.origin}/`}
document.querySelectorAll('.route').forEach(a=>a.href=base()+a.dataset.route);
document.getElementById('search').onclick=()=>{const q=document.getElementById('q').value.trim().toLowerCase();const routes=[['สมัคร','admission/'],['admission','admission/'],['ศิษย์เก่า','alumni/'],['บริจาค','donation/'],['อนุโมทนา','donation/'],['ฉุกเฉิน','emergency/'],['ติดต่อ','responsibilities/'],['60','about-60/'],['โรงเรียน','about-60/']];const hit=routes.find(([k])=>q.includes(k));location.href=base()+(hit?hit[1]:'')};lucide.createIcons();
</script></body></html>
