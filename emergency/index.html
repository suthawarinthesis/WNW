<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ข้อมูลฉุกเฉิน | โรงเรียนวัดหนองแวงวิทยา</title>
<meta name="description" content="ข้อมูลฉุกเฉิน โรงพยาบาล ตำรวจ สายด่วนผู้อำนวยการ และวัดหนองแวงพระอารามหลวง">
<script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/app-config.js?v=20261007-v31"></script><script src="../assets/page-data.js?v=20261007-v31"></script><style>body{font-family:'Noto Sans Thai',sans-serif}</style></head>
<body class="bg-rose-50/40 text-slate-800 min-h-screen">
<header class="bg-gradient-to-br from-rose-700 to-red-800 text-white"><div class="max-w-5xl mx-auto px-4 py-8"><a href="../" class="text-sm text-rose-100 inline-flex gap-2 items-center"><i data-lucide="arrow-left" class="w-4 h-4"></i>กลับหน้าแรก</a><div class="mt-5 flex items-center gap-4"><div class="w-16 h-16 rounded-2xl bg-white/15 flex items-center justify-center"><i data-lucide="siren" class="w-8 h-8"></i></div><div><p class="text-xs font-black uppercase tracking-widest text-rose-200">Emergency Information</p><h1 class="text-3xl sm:text-4xl font-black">ข้อมูลฉุกเฉิน</h1></div></div><p class="text-rose-100 mt-4">กรณีมีเหตุฉุกเฉิน ให้ติดต่อหน่วยงานที่เหมาะสมทันที</p></div></header>
<main class="max-w-5xl mx-auto px-4 py-8">
<div class="rounded-2xl bg-amber-50 border border-amber-200 p-4 text-sm text-amber-900"><b>กรณีอันตรายต่อชีวิต:</b> โทร 1669 หรือ 191 ก่อน แล้วจึงแจ้งโรงเรียน/ผู้ดูแล</div>
<div id="emergency-list" class="grid md:grid-cols-2 gap-4 mt-6"></div>
<div class="mt-6 bg-white rounded-2xl border border-slate-200 p-5"><p class="font-bold">ที่อยู่โรงเรียน</p><p id="emergency-address" class="text-sm text-slate-600 mt-2"></p></div>
</main>
<script>
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
(async()=>{const d=await WNWPageData.load(),arr=(d.emergencyContacts||[]).filter(x=>x.published!==false);
document.getElementById('emergency-address').textContent=d.info?.address||'593 ถ.กลางเมือง อ.เมือง จ.ขอนแก่น 40000';
document.getElementById('emergency-list').innerHTML=arr.map(x=>`<a href="tel:${esc(String(x.phone||'').replace(/\D/g,''))}" class="bg-white rounded-[1.75rem] border border-rose-100 p-6 flex items-center gap-4 hover:border-rose-300 hover:shadow-lg transition"><div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center shrink-0"><i data-lucide="${esc(x.icon||'phone-call')}"></i></div><div class="min-w-0"><p class="text-xs text-slate-400">${esc(x.note||'')}</p><h2 class="font-black text-lg mt-0.5">${esc(x.label||'')}</h2><p class="text-2xl font-black text-rose-600 mt-1">${esc(x.phone||'-')}</p></div></a>`).join('');
lucide.createIcons()})();
</script></body></html>
