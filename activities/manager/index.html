<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Activities Manager</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/app-config.js?v=20261008-departments"></script><style>body{font-family:'Noto Sans Thai',sans-serif;background:#f8fafc}.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.94);box-shadow:0 10px 35px rgba(15,23,42,.07)}.field{width:100%;border:1px solid #e2e8f0;background:#fff;border-radius:1rem;padding:.75rem 1rem;font-size:.875rem;outline:none}.field:focus{border-color:#fb923c;box-shadow:0 0 0 3px rgba(251,146,60,.14)}.label{display:block;font-size:.75rem;font-weight:700;color:#475569;margin-bottom:.4rem}</style></head><body class="min-h-screen text-slate-800">
